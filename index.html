<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Authentic 1981 Galaga Arcade Classic reconstructed with HTML5 Canvas 2D and Web Audio API" />
  <meta name="theme-color" content="#030306" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Galaga — 1981 Arcade Classic</title>

  <!-- Google Fonts: Press Start 2P for authentic Namco 8-bit typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #030306;
      --cabinet-border: #1a1a2e;
      --accent-red: #ff2a2a;
      --accent-yellow: #ffff00;
      --accent-cyan: #00ffff;
      --font-arcade: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-arcade);
      color: #ffffff;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at center, #0a0a18 0%, #030306 100%);
    }

    #app-container, #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
    }

    .canvas-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 100, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      background-color: #000000;
    }

    #game-canvas, #gameCanvas {
      display: block;
      /* Authentic Crisp Pixelated Upscaling */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #000000;
    }

    /* Subtle CRT Scanline Overlay */
    .scanlines {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%,
        rgba(0, 0, 0, 0.25)
      );
      background-size: 100% 4px;
      z-index: 10;
      opacity: 0.6;
    }

    /* Mobile Virtual Controls Overlay */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      box-sizing: border-box;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .touch-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      border-radius: 50%;
      font-family: var(--font-arcade);
      font-size: 14px;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: background-color 0.1s, transform 0.1s;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(255, 42, 42, 0.6);
      transform: scale(0.92);
    }

    .dpad-container {
      display: flex;
      gap: 16px;
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
    }

    .fire-btn {
      width: 72px;
      height: 72px;
      background: rgba(255, 42, 42, 0.3);
      border-color: rgba(255, 42, 42, 0.7);
      color: #ffcccc;
    }

    /* Show touch controls on touch devices / narrow screens */
    @media (hover: none) and (pointer: coarse), (max-width: 600px) {
      #touch-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div class="canvas-wrapper">
      <canvas id="game-canvas" width="224" height="288" aria-label="Galaga Arcade Game Screen" role="img"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
    </div>

    <!-- Virtual Touch Controls for Mobile Devices -->
    <div id="touch-controls" aria-hidden="true">
      <div class="dpad-container">
        <button id="btn-left" class="touch-btn dpad-btn" aria-label="Move Left">◀</button>
        <button id="btn-right" class="touch-btn dpad-btn" aria-label="Move Right">▶</button>
      </div>
      <button id="btn-fire" class="touch-btn fire-btn" aria-label="Fire Missile">FIRE</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
